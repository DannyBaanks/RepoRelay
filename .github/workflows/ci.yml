name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: ruff check reporelay tests

      - name: Run type checking
        run: ruff check --select=ANN reporelay tests

      - name: Run tests
        run: pytest tests/ -v --cov=reporelay --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          files: ./coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t reporelay:latest .

      - name: Run container smoke test
        run: |
          docker run -d -p 8080:8080 --name reporelay-test reporelay:latest
          sleep 5
          curl -f http://localhost:8080/health
          docker stop reporelay-test
          docker rm reporelay-test